# Wafica Design — coming soon page on Netlify.
# No build: the site is the files in this folder, published as they are.

[build]
  base = "."
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    # No JavaScript on this page at all, so scripts are closed completely.
    Content-Security-Policy = "default-src 'self'; script-src 'none'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"

# Fonts and logos never change under the same name: cache for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

# A coming soon site has one page: send any other path home.
[[redirects]]
  from = "/*"
  to = "/"
  status = 302
